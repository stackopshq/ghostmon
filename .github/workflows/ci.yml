name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12"

jobs:
  lint-type:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --python ${{ env.PYTHON_VERSION }}
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghostmon
          POSTGRES_PASSWORD: ghostmon
          POSTGRES_DB: ghostmon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostmon -d ghostmon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ghostmon:ghostmon@localhost:5432/ghostmon_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev --python ${{ env.PYTHON_VERSION }}
      - name: Generate ephemeral app secret
        run: echo "APP_SECRET_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing

  build:
    name: Build OCI image
    runs-on: ubuntu-latest
    needs: [lint-type, test]
    # Porte sur CE job : les autres n'ont besoin que de lire le depot, et un
    # jeton capable d'ecrire des paquets n'a rien a faire la pendant que
    # tournent des actions tierces.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image with Podman
        run: podman build -t ghostmon:ci .

      # Jusqu'ici le job construisait puis jetait. Deployer ghostmon aurait donc
      # voulu dire cloner la source sur l'hote cible et y construire, ce qui rend
      # « quelle version tourne ? » impossible a repondre depuis un registre.
      #
      # Etiquete par SHA COURT, comme le reste de la suite : c'est ce que les
      # roles Ansible epinglent, et une etiquette immuable est ce qui permet de
      # nommer le deploye et d'y revenir. Jamais `latest`, qui transformerait un
      # redemarrage en montee de version non decidee.
      - name: Publish image to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          SHORT="$(git rev-parse --short HEAD)"
          podman tag ghostmon:ci "${IMAGE}:sha-${SHORT}"
          podman tag ghostmon:ci "${IMAGE}:main"
          podman push "${IMAGE}:sha-${SHORT}"
          podman push "${IMAGE}:main"
          echo "published ${IMAGE}:sha-${SHORT}"
          podman logout "${REGISTRY}" || true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Audit dependencies (pip-audit / OSV database)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o requirements.txt
          # `ecdsa` PYSEC-2026-1325 n'a AUCUNE version corrigée. Il arrive par
          # `python-jose`, dont ce dépôt n'a plus qu'un seul appelant —
          # app/core/security/tokens.py — tout le reste étant déjà passé à
          # `joserfc`. La vraie correction est donc de RETIRER la dépendance,
          # pas d'ignorer l'avis ; mais c'est un changement sur le chemin de
          # signature des jetons, qui mérite sa propre PR et ses propres tests.
          #
          # Ignoré NOMMÉMENT et non par une baisse de seuil : la prochaine
          # vulnérabilité fera toujours échouer le job. Une CI qu'on ne peut pas
          # rendre verte apprend à être ignorée ; une CI qu'on rend verte en
          # baissant la barre ne dit plus rien du tout.
          uvx pip-audit -r requirements.txt --strict \
            --ignore-vuln PYSEC-2026-1325
      - name: Scan for secrets (gitleaks)
        run: |
          podman run --rm -v "$PWD:/repo:ro,Z" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --no-banner --redact
