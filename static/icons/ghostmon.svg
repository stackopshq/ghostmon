<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Une seule forme, pas un pictogramme posé sur une autre. L'écran est creusé
       dans le fantôme et les barres y sont re-remplies : `fill-rule="evenodd"`
       compte les imbrications, donc corps (1, plein) → écran (2, creusé) →
       barres (3, pleines). Même construction que ghostcal, ghostmail et
       ghostlink — la suite doit se reconnaître d'un coup d'œil.

       Des barres et non une courbe de pouls : un trait fin s'efface en dessous
       de 32 px, la taille à laquelle un favicon est réellement regardé. -->
  <defs>
    <linearGradient id="g" x1="256" y1="48" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFFF5E"/>
      <stop offset="0.5" stop-color="#A3FF00"/>
      <stop offset="1" stop-color="#5BC800"/>
    </linearGradient>
  </defs>

  <path fill-rule="evenodd" clip-rule="evenodd" fill="url(#g)" d="
