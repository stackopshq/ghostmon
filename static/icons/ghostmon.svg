      M 192.0 254.0 L 210.0 254.0 A 12 12 0 0 1 222.0 266.0 L 222.0 294.0 A 12 12 0 0 1 210.0 306.0 L 192.0 306.0 A 12 12 0 0 1 180.0 294.0 L 180.0 266.0 A 12 12 0 0 1 192.0 254.0 Z
